# Dependabot controlla le dipendenze vere del sito (bun.lock) e propone gli aggiornamenti di sicurezza.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Major con API cambiate (header/menu, modale video, carousel): da migrare a mano, non da bump automatico.
    ignore:
      - dependency-name: "@headlessui/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-player"
        update-types: ["version-update:semver-major"]
      - dependency-name: "usehooks-ts"
        update-types: ["version-update:semver-major"]
