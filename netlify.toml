[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Lo staging ha ancora il plugin Next.js installato dal pannello: così non parte.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  # ID pubblici (finiscono comunque nell'HTML): GTM parte solo dopo il consenso Iubenda.
  NEXT_PUBLIC_GTM_2 = "KS7L68HM"
  NEXT_PUBLIC_IUBENDA_SITE_ID = "54109"
